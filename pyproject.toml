[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bugfinder"
version = "0.1.0"
description = "Local-first code and security analyzer"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7", "platformdirs>=4.2,<5"]

[project.scripts]
bugfinder = "bugfinder.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bugfinder", "bugfinder.*"]
exclude = ["tests", "tests.*", "packaging", "packaging.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
