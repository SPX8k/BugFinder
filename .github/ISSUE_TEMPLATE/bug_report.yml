name: Bug report
description: Report a reproducible BugFinder problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: BugFinder version
    validations:
      required: true
