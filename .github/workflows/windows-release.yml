name: Windows release
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-build.txt
      - run: pyinstaller --noconfirm --clean packaging/bugfinder.spec
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build setup
        shell: cmd
        run: iscc packaging\windows\BugFinder.iss
      - name: Publish Windows release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0' }}
          target_commitish: main
          name: BugFinder v0.1.0
          body: |
            First Windows release of BugFinder.

            Includes the standalone Windows executable and the Windows installer.
          make_latest: true
          overwrite_files: true
          files: |
            dist/BugFinder.exe
            dist/installer/BugFinder-Setup.exe
