name: Windows release
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-build.txt
      - run: pyinstaller --noconfirm --clean packaging/bugfinder.spec
      - name: Sign application executable
        if: env.WINDOWS_CERTIFICATE_BASE64 != '' && env.WINDOWS_CERTIFICATE_PASSWORD != ''
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'bugfinder-signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          try {
            $signtool = Get-ChildItem 'C:\\Program Files (x86)\\Windows Kits\\10\\bin\\*\\x64\\signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signtool) { throw 'Windows SDK signtool.exe was not found.' }
            & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $certificatePath /p $env:WINDOWS_CERTIFICATE_PASSWORD 'dist/BugFinder.exe'
            if ($LASTEXITCODE -ne 0) { throw 'Signing BugFinder.exe failed.' }
          }
          finally {
            Remove-Item $certificatePath -Force -ErrorAction SilentlyContinue
          }
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build setup
        shell: cmd
        run: iscc packaging\windows\BugFinder.iss
      - name: Sign Windows installer
        if: env.WINDOWS_CERTIFICATE_BASE64 != '' && env.WINDOWS_CERTIFICATE_PASSWORD != ''
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'bugfinder-signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          try {
            $signtool = Get-ChildItem 'C:\\Program Files (x86)\\Windows Kits\\10\\bin\\*\\x64\\signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signtool) { throw 'Windows SDK signtool.exe was not found.' }
            & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $certificatePath /p $env:WINDOWS_CERTIFICATE_PASSWORD 'dist/installer/BugFinder-Setup.exe'
            if ($LASTEXITCODE -ne 0) { throw 'Signing BugFinder-Setup.exe failed.' }
          }
          finally {
            Remove-Item $certificatePath -Force -ErrorAction SilentlyContinue
          }
      - name: Publish Windows release
        uses: softprops/action-gh-release@v2
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && env.WINDOWS_CERTIFICATE_BASE64 != '' && env.WINDOWS_CERTIFICATE_PASSWORD != ''
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0' }}
          target_commitish: main
          name: BugFinder v0.1.0
          body: |
            First Windows release of BugFinder.

            Includes the standalone Windows executable and the Windows installer.
          make_latest: true
          overwrite_files: true
          files: |
            dist/BugFinder.exe
            dist/installer/BugFinder-Setup.exe
